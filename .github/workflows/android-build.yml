name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      architecture:
        description: Android CPU architecture
        type: choice
        default: aarch64
        options:
          - aarch64
          - armv7a
          - x86_64
          - x86

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NATIVE_ARCH: ${{ inputs.architecture || 'aarch64' }}
      NDK_VERSION: 28.0.13004108
      KOMELIA_BUILD_JOBS: '2'
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx2g

    steps:
      - name: Check out sources and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            komelia-epub-reader/komga-webui/package-lock.json
            komelia-epub-reader/ttu-ebook-reader/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install project Android platform
        shell: bash
        run: |
          sdk_platform=$(python3 -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["android-sdkPlatform"])')
          sdkmanager "platforms;android-${sdk_platform}"
          echo "ANDROID_SDK_PATH=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_PATH=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build EPUB readers and run reader tests
        run: ./gradlew --no-daemon --no-configuration-cache --max-workers=2 :komelia-ui:jvmTest

      - name: Fingerprint native submodule revisions
        id: native-sources
        shell: bash
        run: |
          revision_hash=$(git submodule status --recursive | sha256sum | cut -d ' ' -f 1)
          echo "hash=${revision_hash}" >> "$GITHUB_OUTPUT"

      - name: Restore compiled native libraries
        id: native-cache
        uses: actions/cache@v5
        with:
          path: cmake/build-android-${{ env.NATIVE_ARCH }}/sysroot/lib
          key: android-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.NATIVE_ARCH }}-ndk${{ env.NDK_VERSION }}-${{ steps.native-sources.outputs.hash }}-${{ hashFiles('.gitmodules', 'CMakeLists.txt', 'cmake/**', 'komelia-infra/**/native/**') }}

      - name: Install native build tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build nasm autoconf automake autopoint \
            autotools-dev libtool libltdl-dev texinfo pkg-config libglib2.0-dev libgtest-dev \
            python3-dev python3-numpy python3-setuptools python3-wheel python3-venv \
            unzip wget aria2 curl
          python3 -m venv --system-site-packages "${RUNNER_TEMP}/komelia-native-tools"
          "${RUNNER_TEMP}/komelia-native-tools/bin/python" -m pip install cmake==3.31.6 meson==1.7.2
          echo "${RUNNER_TEMP}/komelia-native-tools/bin" >> "$GITHUB_PATH"
          sdkmanager "ndk;${NDK_VERSION}"

      - name: Build native image and inference libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: ./cmake/android-build.sh "$NATIVE_ARCH"

      - name: Package Android debug APK
        run: ./gradlew --no-daemon --no-configuration-cache --max-workers=2 "android-${NATIVE_ARCH}_copyJniLibs" androidDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: komelia-android-${{ env.NATIVE_ARCH }}-debug-${{ github.run_number }}
          path: komelia-app/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reader test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reader-test-reports-${{ github.run_number }}
          path: |
            komelia-ui/build/reports/tests/jvmTest/
            komelia-ui/build/test-results/jvmTest/
          if-no-files-found: ignore
          retention-days: 14
